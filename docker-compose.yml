services:
  postgres-event:
    image: postgres:16-alpine
    container_name: qevent-db-event
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password123}"
      POSTGRES_DB: qevent_event
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qevent_event"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-admission:
    image: postgres:16-alpine
    container_name: qevent-db-admission
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password123}"
      POSTGRES_DB: qevent_admission
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - admission_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qevent_admission"]
      interval: 3s
      timeout: 3s
      retries: 10

  postgres-engagement:
    image: postgres:16-alpine
    container_name: qevent-db-engagement
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password123}"
      POSTGRES_DB: qevent_engagement
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - engagement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qevent_engagement"]
      interval: 3s
      timeout: 3s
      retries: 10

  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    container_name: qevent-event-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password123}@postgres-event:5432/qevent_event?schema=public"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required - copy .env.example to .env}"
      PORT: 3001
      NODE_ENV: production
    depends_on:
      postgres-event:
        condition: service_healthy

  admission-service:
    build:
      context: ./services/admission-service
      dockerfile: Dockerfile
    container_name: qevent-admission-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password123}@postgres-admission:5432/qevent_admission?schema=public"
      EVENT_SERVICE_URL: "http://event-service:3001"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required - copy .env.example to .env}"
      KEYS_DIR: "/app/keys"
      PORT: 3002
      NODE_ENV: production
    volumes:
      - admission_keys:/app/keys
    depends_on:
      postgres-admission:
        condition: service_healthy
      event-service:
        condition: service_started

  engagement-service:
    build:
      context: ./services/engagement-service
      dockerfile: Dockerfile
    container_name: qevent-engagement-service
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password123}@postgres-engagement:5432/qevent_engagement?schema=public"
      EVENT_SERVICE_URL: "http://event-service:3001"
      ADMISSION_SERVICE_URL: "http://admission-service:3002"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required - copy .env.example to .env}"
      PORT: 3003
      NODE_ENV: production
    depends_on:
      postgres-engagement:
        condition: service_healthy
      event-service:
        condition: service_started
      admission-service:
        condition: service_started

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: qevent-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env}"
      EVENT_SERVICE_URL: "http://event-service:3001"
      ADMISSION_SERVICE_URL: "http://admission-service:3002"
      ENGAGEMENT_SERVICE_URL: "http://engagement-service:3003"
    depends_on:
      event-service:
        condition: service_started
      admission-service:
        condition: service_started
      engagement-service:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: qevent-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  event_data:
  admission_data:
  engagement_data:
  admission_keys:
