services:
  postgres:
    image: postgres:16-alpine
    container_name: qcheck-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: qcheck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qcheck"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qcheck-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/qcheck?schema=public
      JWT_SECRET: qcheck_super_secret_jwt_key_2026_production_grade
      PORT: 3000
      HOST: 0.0.0.0
      SEED_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
