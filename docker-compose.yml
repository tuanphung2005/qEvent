services:
  postgres:
    image: postgres:16-alpine
    container_name: qevent-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: qevent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qevent"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qevent-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/qevent?schema=public
      JWT_SECRET: qevent_super_secret_jwt_key_2026_production_grade
      PORT: 3000
      HOST: 0.0.0.0
      SEED_DB: "true"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: qevent-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      JWT_SECRET: qevent_super_secret_jwt_key_2026_production_grade
      EVENT_SERVICE_URL: http://backend:3000
      ADMISSION_SERVICE_URL: http://backend:3000
      ENGAGEMENT_SERVICE_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
