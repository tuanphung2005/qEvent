  "/api/game/{gameId}/answer":
    post:
      tags:
        - game
      summary: Submit an answer for the active question
      description: "Requires BR-6. Identity comes from the JWT and timing from the server; `userId` and `responseTimeMs` in the body are ignored."
      operationId: submitGameAnswer
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
            example:
              questionId: 00000000-0000-4000-8000-000000000063
              selectedOption: 0
              userId: string
              responseTimeMs: 1
      responses:
        "200":
          description: Answer scored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
              example:
                isCorrect: true
                score: 750
                responseTimeMs: 10000
        "400":
          description: The answer cannot be accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                closed:
                  value:
                    code: ANSWER_WINDOW_CLOSED
                    message: Current question is not accepting answers
                late:
                  value:
                    code: ANSWER_TOO_LATE
                    message: Time limit exceeded
                wrongQuestion:
                  value:
                    code: NOT_CURRENT_QUESTION
                    message: Answers are only accepted for the currently active question
                invalidOption:
                  value:
                    code: INVALID_OPTION
                    message: Selected option index is out of bounds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The attendee has not checked in to the session's event (BR-6)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: NOT_CHECKED_IN
                message: Attendee has not checked in to this event
        "404":
          description: The quiz game does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: GAME_NOT_FOUND
                message: Quiz game was not found
        "409":
          description: The answer was already submitted or the question has not started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              example:
                code: ALREADY_ANSWERED
                message: You have already submitted an answer for this question
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
