name: web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate API types
        run: bun run gen:api

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Design lint
        run: bun run lint:design

      - name: Route lint
        run: bun run lint:routes

      - name: Encoding lint
        run: bun run lint:encoding

      - name: Unit and component tests
        run: bun run test

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start gateway and services
        run: docker compose up -d --build
        working-directory: .

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "gateway không lên sau 5 phút" >&2
          docker compose logs api-gateway
          exit 1
        working-directory: .

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run e2e
        env:
          E2E_API_BASE: http://localhost:8000
          E2E_WEB_BASE: http://localhost:5173
          CI: "true"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
